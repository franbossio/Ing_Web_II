<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios — Admin CONECTA IA</title>
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/candidate.css" />
  <script src="../../js/theme.js"></script>
  <script src="../../js/mobile-sidebar.js"></script>
  <script src="../../js/sidebar-admin.js" type="module"></script>
  <style>
    .toolbar {
      display: flex; gap: 10px; flex-wrap: wrap;
      align-items: center; margin-bottom: 20px;
    }
    .toolbar-search {
      flex: 1; min-width: 220px; position: relative;
    }
    .toolbar-search input {
      width: 100%; box-sizing: border-box;
      background: var(--clr-surface-2); border: 1px solid var(--clr-border);
      border-radius: var(--radius-sm); color: var(--clr-text);
      font-family: var(--font-body); font-size: 0.84rem;
      padding: 10px 14px 10px 38px; outline: none; transition: border-color var(--transition);
    }
    .toolbar-search input:focus { border-color: var(--clr-accent); }
    .toolbar-search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--clr-muted); font-size: 0.9rem; pointer-events: none;
    }
    .toolbar select {
      background: var(--clr-surface-2); border: 1px solid var(--clr-border);
      border-radius: var(--radius-sm); color: var(--clr-text);
      font-family: var(--font-body); font-size: 0.82rem;
      padding: 10px 12px; outline: none; cursor: pointer;
    }

    /* Tabla */
    .admin-table-wrap { overflow-x: auto; }
    .admin-table { width: 100%; border-collapse: collapse; min-width: 640px; }
    .admin-table thead tr {
      border-bottom: 1px solid var(--clr-border);
    }
    .admin-table th {
      text-align: left; font-size: 0.63rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--clr-muted);
      padding: 0 16px 12px; white-space: nowrap;
    }
    .admin-table td {
      padding: 13px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
      font-size: 0.83rem;
    }
    .admin-table tbody tr:last-child td { border-bottom: none; }
    .admin-table tbody tr:hover td { background: rgba(255,255,255,0.02); }

    .u-cell { display: flex; align-items: center; gap: 11px; }
    .u-av {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--clr-accent), var(--clr-accent-dim));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 700; color: #0d0f14;
      background-size: cover; background-position: center;
    }
    .u-name  { font-size: 0.84rem; font-weight: 600; color: var(--clr-text); line-height: 1.2; }
    .u-email { font-size: 0.7rem; color: var(--clr-muted); margin-top: 2px; }

    .role-badge {
      display: inline-block; font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 100px;
    }
    .rb-candidate { background: rgba(124,200,227,0.1); color: #7ec8e3; border: 1px solid rgba(124,200,227,0.2); }
    .rb-company   { background: rgba(201,168,76,0.1);  color: var(--clr-accent); border: 1px solid rgba(201,168,76,0.2); }
    .rb-admin     { background: rgba(76,175,132,0.1);  color: var(--clr-success); border: 1px solid rgba(76,175,132,0.2); }

    .status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.7rem; font-weight: 600; padding: 4px 10px; border-radius: 100px;
    }
    .status-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-active   { color: var(--clr-success); background: rgba(76,175,132,0.1); border: 1px solid rgba(76,175,132,0.2); }
    .status-inactive { color: var(--clr-error);   background: rgba(224,92,92,0.1);  border: 1px solid rgba(224,92,92,0.2); }

    .actions { display: flex; gap: 6px; }
    .btn-sm {
      font-size: 0.72rem; padding: 6px 12px; border-radius: 6px;
      border: 1px solid var(--clr-border); background: transparent;
      color: var(--clr-muted); cursor: pointer; font-family: var(--font-body);
      transition: all var(--transition); white-space: nowrap;
    }
    .btn-sm:hover:not(:disabled) { border-color: var(--clr-accent); color: var(--clr-accent); background: rgba(201,168,76,0.06); }
    .btn-sm-del {
      font-size: 0.72rem; padding: 6px 12px; border-radius: 6px;
      border: 1px solid rgba(224,92,92,0.25); background: transparent;
      color: var(--clr-error); cursor: pointer; font-family: var(--font-body);
      transition: all var(--transition); white-space: nowrap;
    }
    .btn-sm-del:hover:not(:disabled) { background: rgba(224,92,92,0.08); border-color: var(--clr-error); }
    .btn-sm:disabled, .btn-sm-del:disabled { opacity: 0.35; cursor: not-allowed; }

    .table-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 14px; font-size: 0.76rem; color: var(--clr-muted);
    }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobile-menu-btn">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
            <line x1="1" y1="4" x2="17" y2="4"/><line x1="1" y1="9" x2="17" y2="9"/><line x1="1" y1="14" x2="17" y2="14"/>
          </svg>
        </button>
        <div>
          <div class="topbar-title">Gestión de usuarios</div>
          <div class="topbar-subtitle" id="count-label">Cargando…</div>
        </div>
      </div>
      <div class="topbar-right">
        <a href="dashboard.html" class="btn btn-ghost" style="font-size:0.82rem;padding:8px 14px;">← Volver</a>
      </div>
    </div>

    <div class="page-content">
      <div class="panel">
        <div class="panel-body">

          <div class="toolbar">
            <div class="toolbar-search">
              <span class="toolbar-search-icon">🔍</span>
              <input type="text" id="search" placeholder="Buscar por nombre, empresa o email…" />
            </div>
            <select id="filter-role">
              <option value="">Todos los roles</option>
              <option value="candidate">Candidatos</option>
              <option value="company">Empresas</option>
              <option value="admin">Admins</option>
            </select>
            <select id="filter-status">
              <option value="">Todos los estados</option>
              <option value="active">Activos</option>
              <option value="inactive">Inactivos</option>
            </select>
          </div>

          <div class="admin-table-wrap">
            <div id="table-wrap">
              <div style="padding:40px 0;text-align:center;color:var(--clr-muted);">Cargando usuarios…</div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>
</div>

<div id="global-alert" class="alert" style="position:fixed;bottom:24px;right:24px;z-index:999;max-width:360px;"></div>

<script type="module">
  const API = 'https://ing-web-ii.onrender.com/api';
  let ALL = [];

  const hdrs = () => ({
    'Content-Type': 'application/json',
    Authorization: `Bearer ${localStorage.getItem('talentai_token') || sessionStorage.getItem('talentai_token')}`,
  });

  function alert$(msg, type = 'success') {
    const el = document.getElementById('global-alert');
    el.className = `alert alert-${type} visible`;
    el.textContent = msg;
    setTimeout(() => el.classList.remove('visible'), 3500);
  }

  const roleMap = { candidate:['Candidato','rb-candidate'], company:['Empresa','rb-company'], admin:['Admin','rb-admin'] };

  function roleBadge(r) {
    const [l, c] = roleMap[r] || [r, ''];
    return `<span class="role-badge ${c}">${l}</span>`;
  }

  function initials(u) {
    const n = [u.firstName, u.lastName].filter(Boolean).join(' ') || u.companyName || u.email;
    return n.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase() || '?';
  }

  function displayName(u) {
    return [u.firstName, u.lastName].filter(Boolean).join(' ') || u.companyName || '—';
  }

  function fmtDate(d) {
    return d ? new Date(d).toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' }) : '—';
  }

  function render(list) {
    const el = document.getElementById('table-wrap');
    const meId = JSON.parse(localStorage.getItem('talentai_user') || '{}').id;
    document.getElementById('count-label').textContent =
      `${list.length} de ${ALL.length} usuarios`;

    if (!list.length) {
      el.innerHTML = '<div style="padding:40px 0;text-align:center;color:var(--clr-muted);font-size:0.85rem;">No hay resultados para esa búsqueda.</div>';
      return;
    }

    el.innerHTML = `
      <table class="admin-table">
        <thead><tr>
          <th>Usuario</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Registro</th>
          <th>Acciones</th>
        </tr></thead>
        <tbody>
        ${list.map(u => {
          const isSelf = u.id === meId;
          const avStyle = u.photo ? `style="background-image:url(${u.photo});background-size:cover;background-position:center;"` : '';
          return `<tr data-id="${u.id}">
            <td>
              <div class="u-cell">
                <div class="u-av" ${avStyle}>${u.photo ? '' : initials(u)}</div>
                <div>
                  <div class="u-name">${displayName(u)}</div>
                  <div class="u-email">${u.email}</div>
                </div>
              </div>
            </td>
            <td>${roleBadge(u.role)}</td>
            <td>
              <span class="status-pill ${u.isActive ? 'status-active' : 'status-inactive'}">
                ${u.isActive ? 'Activo' : 'Inactivo'}
              </span>
            </td>
            <td style="color:var(--clr-muted);font-size:0.78rem;">${fmtDate(u.createdAt)}</td>
            <td>
              <div class="actions">
                <button class="btn-sm" onclick="toggleUser('${u.id}',this)"
                  ${isSelf ? 'disabled title="No podés desactivarte a vos mismo"' : ''}>
                  ${u.isActive ? 'Desactivar' : 'Activar'}
                </button>
                <button class="btn-sm-del" onclick="deleteUser('${u.id}','${displayName(u).replace(/'/g,"\\'")}',this)"
                  ${isSelf ? 'disabled title="No podés eliminarte a vos mismo"' : ''}>
                  Eliminar
                </button>
              </div>
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
      <div class="table-footer">
        <span>${list.length} usuario${list.length !== 1 ? 's' : ''} encontrado${list.length !== 1 ? 's' : ''}</span>
      </div>`;
  }

  function applyFilters() {
    const q      = document.getElementById('search').value.toLowerCase().trim();
    const role   = document.getElementById('filter-role').value;
    const status = document.getElementById('filter-status').value;
    render(ALL.filter(u => {
      const haystack = [u.firstName, u.lastName, u.companyName, u.email].filter(Boolean).join(' ').toLowerCase();
      if (q && !haystack.includes(q)) return false;
      if (role && u.role !== role)    return false;
      if (status === 'active'   && !u.isActive) return false;
      if (status === 'inactive' &&  u.isActive) return false;
      return true;
    }));
  }

  async function loadUsers() {
    try {
      const r = await fetch(`${API}/users`, { headers: hdrs() });
      if (!r.ok) throw new Error('Sin permiso');
      ALL = await r.json();
      applyFilters();
    } catch (e) {
      document.getElementById('table-wrap').innerHTML =
        `<div style="color:var(--clr-error);padding:20px;font-size:0.85rem;">Error: ${e.message}</div>`;
    }
  }

  window.toggleUser = async function(id, btn) {
    btn.disabled = true;
    try {
      const r = await fetch(`${API}/users/admin/${id}/toggle`, { method:'PATCH', headers:hdrs() });
      if (!r.ok) throw new Error('Error al cambiar estado');
      const updated = await r.json();
      ALL = ALL.map(u => u.id === id ? updated : u);
      applyFilters();
      alert$(`Usuario ${updated.isActive ? 'activado' : 'desactivado'}`);
    } catch (e) { alert$(e.message, 'error'); btn.disabled = false; }
  };

  window.deleteUser = async function(id, name, btn) {
    if (!confirm(`¿Eliminar a "${name}"?\nEsta acción no se puede deshacer.`)) return;
    btn.disabled = true;
    try {
      const r = await fetch(`${API}/users/admin/${id}`, { method:'DELETE', headers:hdrs() });
      if (!r.ok) throw new Error('Error al eliminar');
      ALL = ALL.filter(u => u.id !== id);
      applyFilters();
      alert$('Usuario eliminado');
    } catch (e) { alert$(e.message, 'error'); btn.disabled = false; }
  };

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('filter-role').addEventListener('change', applyFilters);
  document.getElementById('filter-status').addEventListener('change', applyFilters);

  loadUsers();
</script>

<script src="../../js/sidebar-toggle.js"></script>
</body>
</html>
