<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ofertas — Admin CONECTA IA</title>
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/candidate.css" />
  <script src="../../js/theme.js"></script>
  <script src="../../js/mobile-sidebar.js"></script>
  <script src="../../js/sidebar-admin.js" type="module"></script>
  <style>
    .toolbar {
      display: flex; gap: 10px; flex-wrap: wrap;
      align-items: center; margin-bottom: 20px;
    }
    .toolbar-search { flex: 1; min-width: 220px; position: relative; }
    .toolbar-search input {
      width: 100%; box-sizing: border-box;
      background: var(--clr-surface-2); border: 1px solid var(--clr-border);
      border-radius: var(--radius-sm); color: var(--clr-text);
      font-family: var(--font-body); font-size: 0.84rem;
      padding: 10px 14px 10px 38px; outline: none; transition: border-color var(--transition);
    }
    .toolbar-search input:focus { border-color: var(--clr-accent); }
    .toolbar-search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--clr-muted); pointer-events: none;
    }
    .toolbar select {
      background: var(--clr-surface-2); border: 1px solid var(--clr-border);
      border-radius: var(--radius-sm); color: var(--clr-text);
      font-family: var(--font-body); font-size: 0.82rem;
      padding: 10px 12px; outline: none; cursor: pointer;
    }

    .admin-table-wrap { overflow-x: auto; }
    .admin-table { width: 100%; border-collapse: collapse; min-width: 640px; }
    .admin-table thead tr { border-bottom: 1px solid var(--clr-border); }
    .admin-table th {
      text-align: left; font-size: 0.63rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--clr-muted);
      padding: 0 16px 12px; white-space: nowrap;
    }
    .admin-table td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }
    .admin-table tbody tr:last-child td { border-bottom: none; }
    .admin-table tbody tr:hover td { background: rgba(255,255,255,0.02); }

    .job-title-cell { font-size: 0.85rem; font-weight: 600; color: var(--clr-text); margin-bottom: 3px; }
    .job-area-cell  { font-size: 0.71rem; color: var(--clr-muted); }

    .company-cell { font-size: 0.82rem; color: var(--clr-text); }
    .location-cell { font-size: 0.78rem; color: var(--clr-muted); }

    .status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.7rem; font-weight: 600; padding: 4px 10px; border-radius: 100px;
    }
    .status-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .s-active   { color: var(--clr-success); background: rgba(76,175,132,0.1); border: 1px solid rgba(76,175,132,0.2); }
    .s-inactive { color: var(--clr-muted);   background: rgba(255,255,255,0.05); border: 1px solid var(--clr-border); }

    .skills-wrap { display: flex; flex-wrap: wrap; gap: 4px; max-width: 200px; }
    .skill-tag {
      background: var(--clr-surface-2); border: 1px solid var(--clr-border);
      color: var(--clr-muted); padding: 2px 8px; border-radius: 100px;
      font-size: 0.64rem; font-weight: 500; white-space: nowrap;
    }

    .btn-sm-del {
      font-size: 0.72rem; padding: 6px 14px; border-radius: 6px;
      border: 1px solid rgba(224,92,92,0.25); background: transparent;
      color: var(--clr-error); cursor: pointer; font-family: var(--font-body);
      transition: all var(--transition); white-space: nowrap;
    }
    .btn-sm-del:hover:not(:disabled) { background: rgba(224,92,92,0.08); border-color: var(--clr-error); }
    .btn-sm-del:disabled { opacity: 0.35; cursor: not-allowed; }

    .table-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 14px; font-size: 0.76rem; color: var(--clr-muted);
    }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobile-menu-btn">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
            <line x1="1" y1="4" x2="17" y2="4"/><line x1="1" y1="9" x2="17" y2="9"/><line x1="1" y1="14" x2="17" y2="14"/>
          </svg>
        </button>
        <div>
          <div class="topbar-title">Gestión de ofertas</div>
          <div class="topbar-subtitle" id="count-label">Cargando…</div>
        </div>
      </div>
      <div class="topbar-right">
        <a href="dashboard.html" class="btn btn-ghost" style="font-size:0.82rem;padding:8px 14px;">← Volver</a>
      </div>
    </div>

    <div class="page-content">
      <div class="panel">
        <div class="panel-body">

          <div class="toolbar">
            <div class="toolbar-search">
              <span class="toolbar-search-icon">🔍</span>
              <input type="text" id="search" placeholder="Buscar por título, empresa o ubicación…" />
            </div>
            <select id="filter-status">
              <option value="">Todos los estados</option>
              <option value="active">Activas</option>
              <option value="inactive">Inactivas</option>
            </select>
          </div>

          <div class="admin-table-wrap">
            <div id="table-wrap">
              <div style="padding:40px 0;text-align:center;color:var(--clr-muted);">Cargando ofertas…</div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>
</div>

<div id="global-alert" class="alert" style="position:fixed;bottom:24px;right:24px;z-index:999;max-width:360px;"></div>

<script type="module">
  const API = 'https://ing-web-ii.onrender.com/api';
  let ALL = [];

  const hdrs = () => ({
    'Content-Type': 'application/json',
    Authorization: `Bearer ${localStorage.getItem('talentai_token') || sessionStorage.getItem('talentai_token')}`,
  });

  function alert$(msg, type = 'success') {
    const el = document.getElementById('global-alert');
    el.className = `alert alert-${type} visible`;
    el.textContent = msg;
    setTimeout(() => el.classList.remove('visible'), 3500);
  }

  function fmtDate(d) {
    return d ? new Date(d).toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' }) : '—';
  }

  function escHtml(s) {
    const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML;
  }

  function render(list) {
    const el = document.getElementById('table-wrap');
    document.getElementById('count-label').textContent =
      `${list.length} de ${ALL.length} ofertas`;

    if (!list.length) {
      el.innerHTML = '<div style="padding:40px 0;text-align:center;color:var(--clr-muted);font-size:0.85rem;">No hay resultados.</div>';
      return;
    }

    el.innerHTML = `
      <table class="admin-table">
        <thead><tr>
          <th>Oferta</th>
          <th>Empresa</th>
          <th>Skills</th>
          <th>Estado</th>
          <th>Publicada</th>
          <th>Acción</th>
        </tr></thead>
        <tbody>
        ${list.map(j => `
          <tr data-id="${j.id}">
            <td>
              <div class="job-title-cell">${escHtml(j.title)}</div>
              <div class="job-area-cell">${escHtml(j.area || j.modality || '')}${j.location ? ' · ' + escHtml(j.location) : ''}</div>
            </td>
            <td>
              <div class="company-cell">${escHtml(j.company?.companyName || '—')}</div>
            </td>
            <td>
              <div class="skills-wrap">
                ${(j.skills || []).slice(0,4).map(s => `<span class="skill-tag">${escHtml(s)}</span>`).join('')}
                ${(j.skills || []).length > 4 ? `<span class="skill-tag">+${j.skills.length - 4}</span>` : ''}
              </div>
            </td>
            <td>
              <span class="status-pill ${j.active ? 's-active' : 's-inactive'}">
                ${j.active ? 'Activa' : 'Inactiva'}
              </span>
            </td>
            <td style="color:var(--clr-muted);font-size:0.78rem;">${fmtDate(j.createdAt)}</td>
            <td>
              <button class="btn-sm-del" onclick="deleteJob('${j.id}','${escHtml(j.title).replace(/'/g,"\\'")}',this)">
                Eliminar
              </button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div class="table-footer">
        <span>${list.length} oferta${list.length !== 1 ? 's' : ''} encontrada${list.length !== 1 ? 's' : ''}</span>
      </div>`;
  }

  function applyFilters() {
    const q      = document.getElementById('search').value.toLowerCase().trim();
    const status = document.getElementById('filter-status').value;
    render(ALL.filter(j => {
      const hay = [j.title, j.area, j.location, j.company?.companyName].filter(Boolean).join(' ').toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (status === 'active'   && !j.active) return false;
      if (status === 'inactive' &&  j.active) return false;
      return true;
    }));
  }

  async function loadJobs() {
    try {
      const r = await fetch(`${API}/jobs/admin/all`, { headers: hdrs() });
      if (!r.ok) throw new Error('Sin permiso o error del servidor');
      ALL = await r.json();
      applyFilters();
    } catch (e) {
      document.getElementById('table-wrap').innerHTML =
        `<div style="color:var(--clr-error);padding:20px;font-size:0.85rem;">Error: ${e.message}</div>`;
      document.getElementById('count-label').textContent = 'Error al cargar';
    }
  }

  window.deleteJob = async function(id, title, btn) {
    if (!confirm(`¿Eliminar la oferta "${title}"?\nEsta acción no se puede deshacer y también eliminará las postulaciones asociadas.`)) return;
    btn.disabled = true;
    try {
      const r = await fetch(`${API}/jobs/admin/${id}`, { method:'DELETE', headers:hdrs() });
      if (!r.ok) throw new Error('Error al eliminar');
      ALL = ALL.filter(j => j.id !== id);
      applyFilters();
      alert$('Oferta eliminada correctamente');
    } catch (e) {
      alert$(e.message, 'error');
      btn.disabled = false;
    }
  };

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('filter-status').addEventListener('change', applyFilters);

  loadJobs();
</script>

<script src="../../js/sidebar-toggle.js"></script>
</body>
</html>
