<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil profesional — CONECTA IA</title>
  <link rel="stylesheet" href="../css/global.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    body {
      background: var(--clr-bg);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 16px 60px;
    }
    .pp-brand {
      display: flex; align-items: center; gap: 8px; margin-bottom: 24px;
      color: var(--clr-muted); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.04em;
    }
    .pp-brand span { color: var(--clr-accent); }

    .pp-card {
      width: 100%; max-width: 720px; background: var(--clr-surface);
      border: 1px solid var(--clr-border); border-radius: var(--radius-lg);
      padding: 40px 44px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .pp-header { display: flex; align-items: center; gap: 20px; margin-bottom: 26px; flex-wrap: wrap; }
    .pp-photo {
      width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
      border: 2px solid var(--clr-accent); flex-shrink: 0;
    }
    .pp-avatar-fallback {
      width: 84px; height: 84px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--clr-accent), var(--clr-accent-dim));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: #0d0f14;
    }
    .pp-name  { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--clr-text); }
    .pp-title { font-size: 0.95rem; color: var(--clr-accent); font-weight: 600; margin-top: 2px; }
    .pp-loc   { font-size: 0.82rem; color: var(--clr-muted); margin-top: 4px; }
    .pp-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

    .pp-section { margin-bottom: 22px; }
    .pp-section-title {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--clr-muted); margin-bottom: 10px;
    }
    .pp-bio { font-size: 0.88rem; line-height: 1.7; color: var(--clr-text); }

    .pp-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .pp-tag {
      background: var(--clr-surface-2); border: 1px solid var(--clr-border);
      color: var(--clr-muted); padding: 3px 11px; border-radius: 100px; font-size: 0.76rem; font-weight: 500;
    }

    .pp-item { margin-bottom: 14px; }
    .pp-item-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .pp-item-title { font-size: 0.9rem; font-weight: 600; color: var(--clr-text); }
    .pp-item-sub   { font-size: 0.8rem; color: var(--clr-accent); font-weight: 500; }
    .pp-item-dates { font-size: 0.74rem; color: var(--clr-muted); white-space: nowrap; }
    .pp-item-desc  { font-size: 0.82rem; color: var(--clr-muted); line-height: 1.6; margin-top: 4px; }

    .pp-lang-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 5px 0; border-bottom: 1px dashed var(--clr-border); }
    .pp-lang-row:last-child { border-bottom: none; }

    .pp-link {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem;
      color: var(--clr-accent); text-decoration: none;
      padding: 4px 12px; border: 1px solid rgba(201,168,76,0.3); border-radius: 100px;
    }
    .pp-link:hover { background: rgba(201,168,76,0.08); }

    .pp-state { text-align: center; padding: 60px 24px; color: var(--clr-muted); }
    .pp-state .icon { font-size: 2.4rem; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="pp-brand">🎯 <span>CONECTA IA</span> · Perfil profesional</div>
  <div class="pp-card" id="pp-card">
    <div class="pp-state">
      <div class="icon">⏳</div>
      Cargando perfil…
    </div>
  </div>

  <script type="module">
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function initials(name) {
      return name ? name.split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase() : '?';
    }

    function scoreColor(v) {
      return v >= 70 ? '#4caf84' : v >= 50 ? '#c9a84c' : '#e05c5c';
    }

    function renderProfile(u) {
      const fullName = [u.firstName, u.lastName].filter(Boolean).join(' ') || 'Candidato';

      const photoHtml = u.photo
        ? `<img class="pp-photo" src="${u.photo}" alt="Foto de perfil" />`
        : `<div class="pp-avatar-fallback">${initials(fullName)}</div>`;

      const links = [
        u.linkedin  && `<a href="${u.linkedin}"  target="_blank" class="pp-link">🔗 LinkedIn</a>`,
        u.github    && `<a href="${u.github}"    target="_blank" class="pp-link">🐙 GitHub</a>`,
        u.portfolio && `<a href="${u.portfolio}" target="_blank" class="pp-link">🌐 Portfolio</a>`,
      ].filter(Boolean).join('');

      const scoreBadge = u.cvScore != null
        ? `<span style="display:inline-flex;align-items:center;gap:5px;background:rgba(201,168,76,0.12);color:${scoreColor(u.cvScore)};border:1px solid rgba(201,168,76,0.3);padding:3px 10px;border-radius:100px;font-size:0.75rem;font-weight:700;margin-top:6px;">⭐ CV Score: ${u.cvScore}/100</span>`
        : '';

      const bioHtml = u.bio
        ? `<div class="pp-section"><div class="pp-section-title">Sobre mí</div><div class="pp-bio">${escapeHtml(u.bio)}</div></div>`
        : '';

      const expHtml = (u.experience || []).length
        ? `<div class="pp-section"><div class="pp-section-title">Experiencia laboral</div>
            ${u.experience.map(e => `
              <div class="pp-item">
                <div class="pp-item-top">
                  <div>
                    <div class="pp-item-title">${escapeHtml(e.title)}</div>
                    <div class="pp-item-sub">${escapeHtml(e.company)}</div>
                  </div>
                  <div class="pp-item-dates">${escapeHtml(e.startDate)} – ${e.current ? 'Presente' : escapeHtml(e.endDate || '')}</div>
                </div>
                ${e.description ? `<div class="pp-item-desc">${escapeHtml(e.description)}</div>` : ''}
              </div>`).join('')}
          </div>`
        : '';

      const eduHtml = (u.education || []).length
        ? `<div class="pp-section"><div class="pp-section-title">Educación</div>
            ${u.education.map(ed => `
              <div class="pp-item">
                <div class="pp-item-top">
                  <div>
                    <div class="pp-item-title">${escapeHtml(ed.career)}</div>
                    <div class="pp-item-sub">${escapeHtml(ed.institution)}</div>
                  </div>
                  <div class="pp-item-dates">${escapeHtml(ed.startYear)} – ${escapeHtml(ed.endYear || '')}</div>
                </div>
                ${ed.status ? `<div class="pp-item-desc">${escapeHtml(ed.status)}</div>` : ''}
              </div>`).join('')}
          </div>`
        : '';

      const techCount = (u.skills || []).length;
      const softCount = (u.softSkills || []).length;
      const hasSkills = techCount + softCount > 0;

      const skillsChartHtml = hasSkills ? `
        <div class="pp-section">
          <div class="pp-section-title">Distribución de habilidades</div>
          <div style="display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin-top:8px;">
            <div style="position:relative;width:110px;height:110px;flex-shrink:0;">
              <canvas id="pp-skills-chart" width="110" height="110"></canvas>
              <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;">
                <div style="font-size:1.3rem;font-weight:700;color:var(--clr-text);">${techCount + softCount}</div>
                <div style="font-size:0.6rem;color:var(--clr-muted);">habilidades</div>
              </div>
            </div>
            <div style="flex:1;min-width:120px;display:flex;flex-direction:column;gap:10px;">
              <div>
                <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--clr-muted);margin-bottom:4px;">
                  <span>💻 Técnicas</span><span style="color:#c9a84c;font-weight:600;">${techCount}</span>
                </div>
                <div style="background:rgba(255,255,255,0.06);border-radius:100px;height:6px;overflow:hidden;">
                  <div style="width:${Math.round(techCount / (techCount + softCount) * 100)}%;height:100%;background:#c9a84c;border-radius:100px;"></div>
                </div>
              </div>
              <div>
                <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--clr-muted);margin-bottom:4px;">
                  <span>🤝 Blandas</span><span style="color:#7ec8e3;font-weight:600;">${softCount}</span>
                </div>
                <div style="background:rgba(255,255,255,0.06);border-radius:100px;height:6px;overflow:hidden;">
                  <div style="width:${Math.round(softCount / (techCount + softCount) * 100)}%;height:100%;background:#7ec8e3;border-radius:100px;"></div>
                </div>
              </div>
            </div>
          </div>
        </div>` : '';

      const skillsHtml = techCount
        ? `<div class="pp-section"><div class="pp-section-title">Habilidades técnicas</div>
             <div class="pp-tags">${u.skills.map(s => `<span class="pp-tag">${escapeHtml(s)}</span>`).join('')}</div></div>`
        : '';

      const softSkillsHtml = softCount
        ? `<div class="pp-section"><div class="pp-section-title">Habilidades blandas</div>
             <div class="pp-tags">${u.softSkills.map(s => `<span class="pp-tag">${escapeHtml(s)}</span>`).join('')}</div></div>`
        : '';

      const langHtml = (u.languages || []).length
        ? `<div class="pp-section"><div class="pp-section-title">Idiomas</div>
            ${u.languages.map(l => `<div class="pp-lang-row"><span>${escapeHtml(l.name)}</span><span>${escapeHtml(l.level)}</span></div>`).join('')}
          </div>`
        : '';

      document.getElementById('pp-card').innerHTML = `
        <div class="pp-header">
          ${photoHtml}
          <div>
            <div class="pp-name">${escapeHtml(fullName)}</div>
            ${u.jobTitle ? `<div class="pp-title">${escapeHtml(u.jobTitle)}</div>` : ''}
            ${u.location ? `<div class="pp-loc">📍 ${escapeHtml(u.location)}</div>` : ''}
            ${scoreBadge ? `<div>${scoreBadge}</div>` : ''}
            ${links ? `<div class="pp-links">${links}</div>` : ''}
          </div>
        </div>
        ${bioHtml}
        ${expHtml}
        ${eduHtml}
        ${skillsChartHtml}
        ${skillsHtml}
        ${softSkillsHtml}
        ${langHtml}
      `;

      // Renderizar donut de habilidades después de insertar el HTML
      if (hasSkills) {
        requestAnimationFrame(() => {
          const canvas = document.getElementById('pp-skills-chart');
          if (canvas && window.Chart) {
            new Chart(canvas, {
              type: 'doughnut',
              data: {
                labels: ['Técnicas', 'Blandas'],
                datasets: [{
                  data: [techCount || 0, softCount || 0],
                  backgroundColor: ['#c9a84c', '#7ec8e3'],
                  borderWidth: 0,
                  hoverOffset: 4,
                }]
              },
              options: {
                cutout: '68%',
                responsive: false,
                plugins: {
                  legend: { display: false },
                  tooltip: {
                    callbacks: { label: ctx => ` ${ctx.label}: ${ctx.raw}` },
                    backgroundColor: '#1a1c22',
                    titleColor: '#f0e6c8',
                    bodyColor: '#a0a0a0',
                    borderColor: 'rgba(255,255,255,0.08)',
                    borderWidth: 1,
                    padding: 8,
                    displayColors: false,
                  }
                },
                animation: { duration: 500 },
              }
            });
          }
        });
      }
    }

    function renderError(message) {
      document.getElementById('pp-card').innerHTML = `
        <div class="pp-state">
          <div class="icon">🔍</div>
          ${escapeHtml(message)}
        </div>`;
    }

    async function load() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) { renderError('Falta el identificador del perfil.'); return; }

      try {
        const res = await fetch(`https://ing-web-ii.onrender.com/api/users/public/${id}`);
        if (!res.ok) {
          renderError(res.status === 404 ? 'Este perfil no existe o no está disponible.' : 'No se pudo cargar el perfil.');
          return;
        }
        const user = await res.json();
        renderProfile(user);
      } catch (e) {
        console.error(e);
        renderError('No se pudo cargar el perfil. Intentá de nuevo más tarde.');
      }
    }

    load();
  </script>
</body>
</html>
