<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Postulaciones — CONECTA IA</title>
  <link rel="stylesheet" href="../../css/global.css" />
  <script src="../../js/theme.js"></script>
  <script src="../../js/mobile-sidebar.js"></script>
  <script src="../../js/sidebar-candidate.js" type="module"></script>
  <link rel="stylesheet" href="../../css/candidate.css" />
  <link rel="stylesheet" href="../../css/applications.css" />

</head>
<body>

  <div class="app-layout">
    <div id="sidebar-root"></div>

    <!-- ══════════════════════════════════════════
        MAIN CONTENT
    ══════════════════════════════════════════ -->
    <main class="main-content">

      <div class="topbar">
        <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menú">
        <svg viewBox="0 0 18 18"><line x1="1" y1="4" x2="17" y2="4"/><line x1="1" y1="9" x2="17" y2="9"/><line x1="1" y1="14" x2="17" y2="14"/></svg>
      </button>
          <div class="topbar-title">Mis postulaciones</div>
          <div class="topbar-subtitle">Seguí el estado de cada una de tus aplicaciones</div>
        </div>
        <div class="topbar-right">
          <button class="icon-btn">🔔<span class="notif-dot"></span></button>
          <a href="jobs.html" class="btn btn-primary" style="padding:9px 18px;font-size:0.85rem;">
            🔍 Ver ofertas
          </a>
        </div>
      </div>

      <div class="page-content">

        <!-- ── Stats por estado ── -->
        <div class="app-stats">
          <div class="app-stat active-filter" data-filter="all" onclick="filterApps('all', this)">
            <div class="app-stat-num">5</div>
            <div class="app-stat-label">Total</div>
          </div>
          <div class="app-stat" data-filter="revision" onclick="filterApps('revision', this)">
            <div class="app-stat-num" style="color:var(--clr-accent);">2</div>
            <div class="app-stat-label">En revisión</div>
          </div>
          <div class="app-stat" data-filter="entrevista" onclick="filterApps('entrevista', this)">
            <div class="app-stat-num" style="color:var(--clr-success);">1</div>
            <div class="app-stat-label">Entrevista</div>
          </div>
          <div class="app-stat" data-filter="pendiente" onclick="filterApps('pendiente', this)">
            <div class="app-stat-num" style="color:var(--clr-muted);">1</div>
            <div class="app-stat-label">Pendiente</div>
          </div>
          <div class="app-stat" data-filter="rechazado" onclick="filterApps('rechazado', this)">
            <div class="app-stat-num" style="color:var(--clr-error);">1</div>
            <div class="app-stat-label">No seleccionado</div>
          </div>
        </div>

        <!-- ── Filtros ── -->
        <div class="filters-bar">
          <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Buscá por empresa o puesto..." />
          </div>
          <select class="filter-select" id="filter-order">
            <option>Más recientes primero</option>
            <option>Más antiguas primero</option>
            <option>Mayor match</option>
          </select>
          <select class="filter-select" id="filter-modality">
            <option value="">Cualquier modalidad</option>
            <option>Remoto</option>
            <option>Presencial</option>
            <option>Híbrido</option>
          </select>
          <span class="results-info" id="results-count">5 postulaciones</span>
        </div>

        <!-- ── Status tabs ── -->
        <div class="status-tabs">
          <button class="status-tab active" data-status="all" onclick="switchTab('all', this)">
            Todas <span class="status-tab-count">5</span>
          </button>
          <button class="status-tab" data-status="revision" onclick="switchTab('revision', this)">
            🟡 En revisión <span class="status-tab-count">2</span>
          </button>
          <button class="status-tab" data-status="entrevista" onclick="switchTab('entrevista', this)">
            🟢 Entrevista <span class="status-tab-count">1</span>
          </button>
          <button class="status-tab" data-status="pendiente" onclick="switchTab('pendiente', this)">
            ⚪ Pendiente <span class="status-tab-count">1</span>
          </button>
          <button class="status-tab" data-status="rechazado" onclick="switchTab('rechazado', this)">
            🔴 No seleccionado <span class="status-tab-count">1</span>
          </button>
        </div>

        <!-- ══════════════════════════════════════
            LISTA DE POSTULACIONES
        ══════════════════════════════════════ -->
        <div id="applications-list">
        </div><!-- /applications-list -->

        <!-- Empty state (oculto por defecto) -->
        <div class="empty-state" id="empty-state" style="display:none;">
          <div class="empty-icon">📭</div>
          <div class="empty-title">Sin postulaciones en este estado</div>
          <div class="empty-desc">No tenés postulaciones con este filtro aplicado.</div>
          <a href="jobs.html" class="btn btn-primary">Explorar ofertas</a>
        </div>

      </div><!-- /page-content -->
    </main>
  </div>
<script type="module">
const STATUS_LABEL = {
  pendiente:  { text: 'Pendiente',       badge: 'badge-gray'  },
  revision:   { text: 'En revisión',     badge: 'badge-gold'  },
  entrevista: { text: 'Entrevista',      badge: 'badge-green' },
  rechazado:  { text: 'No seleccionado', badge: 'badge-red'   },
  aceptado:   { text: '🎉 Aceptado',     badge: 'badge-green' },
};
const TIMELINE = [
  { key:'pendiente',  icon:'📩', label:'Postulado'   },
  { key:'revision',   icon:'👀', label:'En revisión' },
  { key:'entrevista', icon:'💬', label:'Entrevista'  },
  { key:'aceptado',   icon:'🎉', label:'Aceptado'    },
];
const T_ORDER = ['pendiente','revision','entrevista','aceptado'];

async function loadApplications() {
  const token = localStorage.getItem('talentai_token') || sessionStorage.getItem('talentai_token');
  if (!token) return;
  try {
    const res  = await fetch('http://localhost:3001/api/applications/my', {
      headers: { Authorization: `Bearer ${token}` }
    });
    const apps = res.ok ? await res.json() : [];

    // Contadores tabs
    const counts = { all: apps.length, pendiente: 0, revision: 0, entrevista: 0, rechazado: 0 };
    apps.forEach(a => { if (counts[a.status] !== undefined) counts[a.status]++; });
    document.querySelectorAll('.status-tab').forEach(tab => {
      const s  = tab.dataset.status;
      const el = tab.querySelector('.status-tab-count');
      if (el) el.textContent = s === 'all' ? counts.all : (counts[s] || 0);
    });

    const container = document.getElementById('applications-list');
    if (!container) return;

    if (!apps.length) {
      container.innerHTML = `<div style="text-align:center;padding:48px;color:var(--clr-muted);">
        <div style="font-size:2rem;margin-bottom:12px;">📭</div>
        <div style="margin-bottom:12px;">Todavía no te postulaste a ninguna oferta.</div>
        <a href="jobs.html" style="color:var(--clr-accent);text-decoration:none;font-weight:600;">Explorar ofertas →</a>
      </div>`;
      return;
    }

    container.innerHTML = apps.map(app => {
      const job  = app.job  || {};
      const co   = job.company || {};
      const st   = STATUS_LABEL[app.status] || STATUS_LABEL.pendiente;
      const date = new Date(app.createdAt).toLocaleDateString('es-AR');
      const curIdx = T_ORDER.indexOf(app.status);
      const salary = job.salaryMin
        ? `💰 ${job.currency||''} ${Number(job.salaryMin).toLocaleString()}${job.salaryMax?' – '+Number(job.salaryMax).toLocaleString():''}`
        : '';

      const timelineHTML = app.status === 'rechazado'
        ? `<div class="timeline-step rejected"><div class="timeline-dot">✕</div><div class="timeline-step-label">No seleccionado</div></div>`
        : TIMELINE.map((s,i) => {
            const cls = i < curIdx ? 'done' : i === curIdx ? 'active' : '';
            return `<div class="timeline-step ${cls}"><div class="timeline-dot">${cls==='done'?'✓':s.icon}</div><div class="timeline-step-label">${s.label}</div></div>`;
          }).join('');

      return `<div class="application-card" data-status="${app.status}">
        <div class="app-card-main">
          <div class="app-company-logo">🏢</div>
          <div class="app-card-info">
            <div class="app-card-top">
              <div>
                <div class="app-job-title">${job.title || '—'}</div>
                <div class="app-company">${co.companyName || 'Empresa'}${job.location?' · '+job.location:''}</div>
              </div>
              <span class="badge ${st.badge}"><span class="badge-dot"></span>${st.text}</span>
            </div>
            <div class="app-meta">
              ${job.modality?`<span>📍 ${job.modality}</span>`:''}
              ${job.contract?`<span>⏱ ${job.contract}</span>`:''}
              ${salary?`<span>${salary}</span>`:''}
              <span>📅 Postulado el ${date}</span>
            </div>
          </div>
        </div>
        <div class="app-timeline">
          <div class="timeline-label">Progreso de la postulación</div>
          <div class="timeline-steps">${timelineHTML}</div>
        </div>
        ${app.companyNotes?`<div class="app-card-footer"><div class="app-card-footer-left">💬 ${app.companyNotes}</div></div>`:''}
      </div>`;
    }).join('');

    // Filtros tabs
    document.querySelectorAll('.status-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const s = tab.dataset.status;
        document.querySelectorAll('.application-card').forEach(card => {
          card.style.display = s==='all' || card.dataset.status===s ? '' : 'none';
        });
      });
    });

  } catch(err) { console.error('Error:', err); }
}

loadApplications();
</script>
  <script src="../../js/sidebar-toggle.js"></script>
</body>
</html>
