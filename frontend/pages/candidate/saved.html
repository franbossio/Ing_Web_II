<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guardados — CONECTA IA</title>
  <link rel="stylesheet" href="../../css/global.css" />
  <script src="../../js/theme.js"></script>
  <script src="../../js/mobile-sidebar.js"></script>
  <script src="../../js/sidebar-candidate.js" type="module"></script>
  <link rel="stylesheet" href="../../css/candidate.css" />
  <link rel="stylesheet" href="../../css/saved.css"/>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>

    <main class="main-content">
      <div class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menú">
            <svg viewBox="0 0 18 18"><line x1="1" y1="4" x2="17" y2="4"/><line x1="1" y1="9" x2="17" y2="9"/><line x1="1" y1="14" x2="17" y2="14"/></svg>
          </button>
          <div class="topbar-title">Guardados</div>
          <div class="topbar-subtitle">Ofertas que marcaste para revisar después</div>
        </div>
        <div class="topbar-right">
          <button class="icon-btn">🔔<span class="notif-dot"></span></button>
          <a href="jobs.html" class="btn btn-primary" style="padding:9px 18px;font-size:0.85rem;">🔍 Explorar ofertas</a>
        </div>
      </div>

      <div class="page-content">

        <!-- Stats — se llenan desde JS -->
        <div class="saved-stats">
          <div class="saved-stat">
            <div class="saved-stat-icon">⭐</div>
            <div>
              <div class="saved-stat-num" id="stat-total">—</div>
              <div class="saved-stat-label">Total guardadas</div>
            </div>
          </div>
          <div class="saved-stat">
            <div class="saved-stat-icon">✅</div>
            <div>
              <div class="saved-stat-num" id="stat-active" style="color:var(--clr-success);">—</div>
              <div class="saved-stat-label">Ofertas activas</div>
            </div>
          </div>
          <div class="saved-stat">
            <div class="saved-stat-icon">⏰</div>
            <div>
              <div class="saved-stat-num" id="stat-expired" style="color:var(--clr-error);">—</div>
              <div class="saved-stat-label">Vencidas</div>
            </div>
          </div>
        </div>

        <!-- Toolbar -->
        <div class="saved-toolbar">
          <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Buscá entre tus guardados..." />
          </div>
          <select class="filter-select" id="filter-order">
            <option value="saved">Orden guardado</option>
            <option value="alpha">Alfabético</option>
          </select>
          <select class="filter-select" id="filter-status">
            <option value="all">Todas las ofertas</option>
            <option value="active">Solo activas</option>
            <option value="expired">Solo vencidas</option>
          </select>
          <span class="results-info" id="results-count">— guardadas</span>
        </div>

        <!-- Tabs -->
        <div class="saved-tabs">
          <button class="saved-tab active" data-tab="all">
            Todas <span class="tab-count" id="tab-all">—</span>
          </button>
          <button class="saved-tab" data-tab="active">
            ✅ Activas <span class="tab-count" id="tab-active">—</span>
          </button>
          <button class="saved-tab" data-tab="expired">
            ⏰ Vencidas <span class="tab-count" id="tab-expired">—</span>
          </button>
        </div>

        <!-- Cards -->
        <div id="saved-list"></div>

        <!-- Empty state -->
        <div class="empty-state" id="empty-state" style="display:none;">
          <div class="empty-icon">⭐</div>
          <div class="empty-title">Sin ofertas guardadas</div>
          <div class="empty-desc">Guardá ofertas desde el explorador para revisarlas después.</div>
          <a href="jobs.html" class="btn btn-primary">Explorar ofertas</a>
        </div>

      </div>
    </main>
  </div>

  <script type="module">
    import { logout } from '../../js/auth.js';
    window.cerrarSesion = function(e) {
      if (e) e.preventDefault();
      if (confirm('¿Cerrar sesión?')) logout();
    };

    const SAVED_KEY = 'conectaia_saved_jobs';
    const TOKEN     = () => localStorage.getItem('talentai_token') || sessionStorage.getItem('talentai_token');

    function getSavedIds() {
      try { return JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'); } catch { return []; }
    }
    function setSavedIds(ids) {
      localStorage.setItem(SAVED_KEY, JSON.stringify(ids));
    }

    // Estado global
    let ALL_SAVED   = [];   // jobs completos que el user guardó
    let activeTab   = 'all';
    let activeSearch = '';
    let activeOrder  = 'saved';

    // ── Actualizar stats y tabs con datos reales ────────────────────────
    function updateStats() {
      const total   = ALL_SAVED.length;
      const active  = ALL_SAVED.filter(j => j.active !== false).length;
      const expired = total - active;

      document.getElementById('stat-total').textContent   = total;
      document.getElementById('stat-active').textContent  = active;
      document.getElementById('stat-expired').textContent = expired;

      document.getElementById('tab-all').textContent     = total;
      document.getElementById('tab-active').textContent  = active;
      document.getElementById('tab-expired').textContent = expired;
    }

    // ── Render de una card ──────────────────────────────────────────────
    function renderCard(job) {
      const co     = job.company || {};
      const isActive = job.active !== false;
      const salary = job.salaryMin
        ? `💰 ${job.currency||''} ${Number(job.salaryMin).toLocaleString()}${job.salaryMax?' – '+Number(job.salaryMax).toLocaleString():''}/mes`
        : '';
      const skills = (job.skills || []).slice(0, 4)
        .map(sk => `<span class="skill-tag">${sk}</span>`).join('');

      return `<div class="saved-card"
                   data-job-id="${job.id}"
                   data-status="${isActive ? 'active' : 'expired'}"
                   data-title="${(job.title||'').toLowerCase()}"
                   data-company="${(co.companyName||'').toLowerCase()}">
        <div class="saved-card-header">
          <div class="saved-card-left">
            <div class="company-logo">🏢</div>
            <div>
              <div class="saved-job-title">${job.title}</div>
              <div class="saved-company">${co.companyName||'Empresa'}${job.location ? ' · ' + job.location : ''}</div>
            </div>
          </div>
          <div class="saved-card-right">
            ${isActive
              ? `<span class="badge badge-green" style="font-size:0.7rem;"><span class="badge-dot"></span> Activa</span>`
              : `<span class="badge badge-red"   style="font-size:0.7rem;"><span class="badge-dot"></span> Vencida</span>`}
          </div>
        </div>
        <div class="saved-card-meta">
          ${job.modality   ? `<span>📍 ${job.modality}</span>`   : ''}
          ${job.contract   ? `<span>⏱ ${job.contract}</span>`   : ''}
          ${job.experience ? `<span>🏆 ${job.experience}</span>` : ''}
          ${salary         ? `<span>${salary}</span>`             : ''}
        </div>
        ${skills ? `<div class="saved-card-tags">${skills}</div>` : ''}
        <div class="saved-card-footer">
          <div></div>
          <div class="saved-card-actions">
            <button class="btn btn-ghost" style="padding:7px 14px;font-size:0.78rem;"
              onclick="removeSaved('${job.id}', this)">🗑 Quitar</button>
            <button class="btn btn-primary" style="padding:7px 14px;font-size:0.78rem;"
              onclick="applyFromSaved('${job.id}', this)">Postularme</button>
          </div>
        </div>
      </div>`;
    }

    // ── Aplicar filtros ─────────────────────────────────────────────────
    function applyFilters() {
      let filtered = [...ALL_SAVED];

      // Tab / status
      if (activeTab === 'active')  filtered = filtered.filter(j => j.active !== false);
      if (activeTab === 'expired') filtered = filtered.filter(j => j.active === false);

      // Búsqueda
      if (activeSearch) {
        const q = activeSearch.toLowerCase();
        filtered = filtered.filter(j =>
          (j.title || '').toLowerCase().includes(q) ||
          (j.company?.companyName || '').toLowerCase().includes(q)
        );
      }

      // Orden
      if (activeOrder === 'alpha') {
        filtered.sort((a, b) => (a.title||'').localeCompare(b.title||''));
      }

      const container = document.getElementById('saved-list');
      const emptyEl   = document.getElementById('empty-state');
      const countEl   = document.getElementById('results-count');

      if (!filtered.length) {
        container.innerHTML = '';
        emptyEl.style.display = 'block';
        countEl.textContent   = '0 guardadas';
      } else {
        container.innerHTML   = filtered.map(renderCard).join('');
        emptyEl.style.display = 'none';
        countEl.textContent   = `${filtered.length} guardada${filtered.length !== 1 ? 's' : ''}`;
      }
    }

    // ── Quitar guardado ─────────────────────────────────────────────────
    window.removeSaved = function(jobId, btn) {
      const ids = getSavedIds().filter(id => id !== jobId);
      setSavedIds(ids);
      ALL_SAVED = ALL_SAVED.filter(j => j.id !== jobId);
      updateStats();
      applyFilters();
    };

    // ── Postularse desde guardados — llama al backend real ──────────────
    window.applyFromSaved = async function(jobId, btn) {
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:13px;height:13px;border-width:2px;border-top-color:#0d0f14;display:inline-block;vertical-align:middle;margin-right:4px;"></div>';
      try {
        const res = await fetch('https://ing-web-ii.onrender.com/api/applications', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${TOKEN()}` },
          body: JSON.stringify({ jobId }),
        });
        if (!res.ok) {
          const e = await res.json().catch(() => ({ message: 'Error' }));
          throw new Error(e.message);
        }
        btn.textContent = '✓ Postulado';
        btn.style.cssText = 'padding:7px 14px;font-size:0.78rem;background:rgba(76,175,132,.15);color:var(--clr-success);border:1px solid rgba(76,175,132,.3);border-radius:var(--radius-sm);font-family:var(--font-body);font-weight:600;cursor:default;';
        btn.onclick = null;
      } catch(err) {
        btn.disabled = false;
        btn.textContent = 'Postularme';
        alert('✗ ' + err.message);
      }
    };

    // ── Cargar desde backend ────────────────────────────────────────────
    async function loadSaved() {
      const savedIds = getSavedIds();

      // Mostrar 0 si no hay nada guardado
      if (!savedIds.length) {
        document.getElementById('stat-total').textContent   = 0;
        document.getElementById('stat-active').textContent  = 0;
        document.getElementById('stat-expired').textContent = 0;
        document.getElementById('tab-all').textContent      = 0;
        document.getElementById('tab-active').textContent   = 0;
        document.getElementById('tab-expired').textContent  = 0;
        document.getElementById('results-count').textContent = '0 guardadas';
        document.getElementById('empty-state').style.display = 'block';
        return;
      }

      try {
        const res  = await fetch('https://ing-web-ii.onrender.com/api/jobs', {
          headers: { Authorization: `Bearer ${TOKEN()}` }
        });
        const jobs = res.ok ? await res.json() : [];

        // Filtrar solo los que el user guardó, manteniendo el orden de guardado
        ALL_SAVED = savedIds
          .map(id => jobs.find(j => j.id === id))
          .filter(Boolean);

        updateStats();
        applyFilters();

      } catch(err) {
        console.error('Error saved:', err);
      }
    }

    // ── Listeners ───────────────────────────────────────────────────────

    // Tabs
    document.querySelectorAll('.saved-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.saved-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        activeTab = this.dataset.tab;
        applyFilters();
      });
    });

    // Búsqueda
    document.getElementById('search-input').addEventListener('input', function() {
      activeSearch = this.value.trim();
      applyFilters();
    });

    // Orden
    document.getElementById('filter-order').addEventListener('change', function() {
      activeOrder = this.value;
      applyFilters();
    });

    // Select status (sincronizado con tabs)
    document.getElementById('filter-status').addEventListener('change', function() {
      activeTab = this.value;
      document.querySelectorAll('.saved-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === this.value);
      });
      applyFilters();
    });

    loadSaved();
  </script>

  <script src="../../js/sidebar-toggle.js"></script>
</body>
</html>
